<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--seo-->
    <title>Interactive Periodic Table for Students | Elementra</title>
    <meta name="description" content="Free interactive periodic table of all 118 elements with trends, electron configurations, mnemonics, flashcards and quizzes. Built for students." />
    <link rel="canonical" href="https://elementra.subirhazra.com/" />
    <!--/seo-->

    <meta name="google-site-verification" content="o2IhMzkxCfJmI1x711VlXw9tHQpLzU9fuU-xf97g81w" />
    <meta name="author" content="Elementra" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070a14" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self' https://api.periodictableofelements.org https://en.wikipedia.org ws: wss:; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-src 'self'; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org; manifest-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'self'"
    />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('elementra-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f7fb');
        } catch (e) {}
      })();
    </script>

    <!-- Fonts load without blocking the first paint; text shows in a fallback font until they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      />
    </noscript>
    <link rel="preconnect" href="https://thumb.wikimedia.org" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 12px 24px; text-align: center">Turn on JavaScript to use the interactive table, flashcards and quizzes.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
